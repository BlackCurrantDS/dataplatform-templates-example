pipelines:
  dynamic_multi_source_dlt:
    name: dynamic_multi_source_dlt
    description: "DLT pipeline for Bronze/Silver ingestion with GE validation"
    continuous: false
    development: true
    photon: true
    libraries:
      - notebook:
          path: ../notebooks/templates/03_dynamic_dlt_gold_template.py
    cluster:
      new_cluster:
        spark_version: "14.0.x-cpu-ml-scala2.12"
        node_type_id: "i3.xlarge"
        num_workers: 2
        autoscale:
          min_workers: 2
          max_workers: 8
    configuration:
      env: ${bundle.target}
      logger_name: dynamic_multi_source_gold
      config_path: ../configs/dynamic_sources.yaml
    schedule:
      quartz_cron_expression: "0 0 * * * ?"
      timezone_id: "UTC"
    email_notifications:
      on_failure:
        - bhardwaj.priyamvada30@gmail.com
    environments:
      - environment_key: default
        spec:
          environment_version: "4"
          dependencies:
            - great_expectations>=0.21.16
            - pyyaml>=6.0