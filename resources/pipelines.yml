resources:  
  pipelines:
    dynamic_multi_source_dlt:
      name: dynamic_multi_source_dlt
      allow_duplicate_names: false
      serverless: true
      catalog: ${var.catalog}
      schema: ${var.schema}
      continuous: false
      libraries:
        - glob:
            include: ../shared_modules/**
        - file:
            path: ../notebooks/templates/00_standard_dlt_template.py
      configuration:
        env: ${bundle.target}
        logger_name: dynamic_multi_source_gold
        config_path: ../configs/dynamic_sources.yaml        

      environment:
        dependencies:
          - great_expectations>=0.21.16
          - pyyaml>=6.0