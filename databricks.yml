# ==========================================
# Databricks Asset Bundle Configuration
# Supports Dev & Prod environments
# Best practices:
# - Dev and Prod separation
# - Service principal deployment
# - Workspace isolation
# - Environment-specific mode and paths
# ==========================================

bundle:
  name: my-dbt-dlt-bundle

run_as:
  # Use a service principal for CI/CD deployments
  service_principal_name: e1798786-5e76-4f16-a7c3-56b17bdb8166

include:
  # Include all resource definitions (pipelines, notebooks, jobs, etc.)
  - resources/*.yml
  - resources/*/*.yml

# synchronize additional filesystem items (non-YAML/JSON) such as helper modules
sync:
  include:
    - notebooks/**
    - configs/**

# Define variables to make the bundle environment-aware
variables:
  catalog:
    description: "Unity Catalog catalog name for tables"
    default: "main"
  schema:
    description: "Unity Catalog schema (database) name for tables"
    default: "events"
  source_raw_table:
    description: "Raw input table for the DLT pipeline"
    default: "raw_events"

# -------------------------------
# Environment-specific targets
# -------------------------------
targets:

  dev:
    # Development mode ensures resources are isolated, schedules paused
    mode: development
    default: true
    workspace:
      host: https://dbc-a1581223-795d.cloud.databricks.com/    # Databricks workspace URL
      root_path: "~/dbt_bundle/dev"             # Dev-specific root folder
    variables:
      catalog: dev_catalog_dlt
      schema: dlt_test
      source_raw_table: dev_raw.events

  prod:
    # Production mode deploys actual resources, schedules active
    mode: production
    workspace:
      host: https://dbc.cloud.databricks.com/    # Databricks workspace URL
      root_path: "~/dbt_bundle/prod"           # Prod-specific root folder