name: DLT & DBT CI/CD with Asset Bundles

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy-dlt-dbt:
    runs-on: ubuntu-latest

    # Common environment variables
    env:
      DBT_PROFILES_DIR: ./dbt_project/profiles/
      DBT_PROJECT_DIR: ./dataplatform-templates-example

      # Dev
      DATABRICKS_HOST_DEV: ${{ secrets.DATABRICKS_HOST_CLI }}
      DATABRICKS_CLIENT_ID_DEV: ${{ secrets.DATABRICKS_CLIENT_ID_CLI }}
      DATABRICKS_CLIENT_SECRET_DEV: ${{ secrets.DATABRICKS_TOKEN_CLI }}
      DATABRICKS_BUNDLE_TARGET_DEV: dev

      # Prod
      DATABRICKS_HOST_PROD: ${{ secrets.DATABRICKS_HOST_CLI_PROD }}
      DATABRICKS_CLIENT_ID_PROD: ${{ secrets.DATABRICKS_CLIENT_ID_CLI_PROD }}
      DATABRICKS_CLIENT_SECRET_PROD: ${{ secrets.DATABRICKS_TOKEN_CLI_PROD }}
      DATABRICKS_BUNDLE_TARGET_PROD: prod

      # Set target dynamically based on branch
      DATABRICKS_HOST: ${{ github.ref == 'refs/heads/dev' && secrets.DATABRICKS_HOST_CLI || secrets.DATABRICKS_HOST_CLI_PROD }}
      DATABRICKS_CLIENT_ID: ${{ github.ref == 'refs/heads/dev' && secrets.DATABRICKS_CLIENT_ID_CLI || secrets.DATABRICKS_CLIENT_ID_CLI_PROD }}
      DATABRICKS_CLIENT_SECRET: ${{ github.ref == 'refs/heads/dev' && secrets.DATABRICKS_TOKEN_CLI || secrets.DATABRICKS_TOKEN_CLI_PROD }}
      DATABRICKS_BUNDLE_TARGET: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'prod' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Asset Bundle
        run: |
          databricks bundle validate --target $DATABRICKS_BUNDLE_TARGET

      - name: Deploy Asset Bundle
        run: |
          databricks bundle deploy --target $DATABRICKS_BUNDLE_TARGET